name: Android APK offline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/test-app/**'
      - '.github/workflows/android-test.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile/test-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar Capacitor
        run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mundo-abierto-offline-debug-key-v1
      - name: Preparar Android
        run: npm run android:prepare
      - name: Compilar APK
        working-directory: mobile/test-app/android
        run: bash gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Mundo-Abierto-Offline-APK
          path: mobile/test-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
