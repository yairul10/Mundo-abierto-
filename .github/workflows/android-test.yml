name: Android APK + Play AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/test-app/**'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'index.html'
      - 'version.json'
      - 'tests/**'
      - 'server/pvp/combat.mjs'
      - 'server/pvp/combat.test.mjs'
      - 'server/pvp/world-rules*.mjs'
      - 'server/pvp/skills*.mjs'
      - 'server/pvp/chat*.mjs'
      - 'server/pvp/account*.mjs'
      - 'server/cloud-save/**'
      - 'server/pvp/shared-world*.mjs'
      - '.github/workflows/android-test.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile/test-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar combate, escalado y hangar
        working-directory: .
        run: node --test tests/*.test.mjs server/pvp/combat.test.mjs server/pvp/world-rules.test.mjs server/pvp/skills.test.mjs server/pvp/chat.test.mjs server/pvp/account.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar Capacitor
        run: npm ci --no-audit --no-fund
      - name: Comprobar brazos y propulsores del jefe PvP
        run: node --test test-boss-rig.mjs
      - name: Preparar firma permanente
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: node prepare-signing.mjs
      - name: Preparar Android
        run: npm run android:prepare
      - name: Compilar APK
        working-directory: mobile/test-app/android
        run: bash gradlew assembleDebug --no-daemon
      - name: Compilar AAB firmado para Google Play
        working-directory: mobile/test-app/android
        run: bash gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Cosmos-Legacy-Play-AAB
          path: mobile/test-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Mundo-Abierto-Offline-APK
          path: mobile/test-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

